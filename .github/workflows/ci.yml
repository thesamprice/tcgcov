name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  python:
    name: python ${{ matrix.python }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        # The package is pure standard library; 3.8 is the floor declared in
        # pyproject.toml, so test the floor and a current release.
        python: ["3.8", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python }}
      - name: Unit tests
        run: python -m unittest discover -s tests -t . -v
      - name: Import check (no third-party dependencies)
        run: |
          python - <<'PY'
          import ast, pathlib, sys
          # The zero-dependency promise is load-bearing: assert every import in
          # the package resolves to the stdlib or to tcgcov itself.
          stdlib = getattr(sys, "stdlib_module_names", None)
          if stdlib is None:
              print("python < 3.10, skipping stdlib name check")
              raise SystemExit(0)
          bad = []
          for p in pathlib.Path("tcgcov").rglob("*.py"):
              for node in ast.walk(ast.parse(p.read_text())):
                  if isinstance(node, ast.Import):
                      names = [a.name.split(".")[0] for a in node.names]
                  elif isinstance(node, ast.ImportFrom):
                      if node.level:          # relative import, in-package
                          continue
                      names = [(node.module or "").split(".")[0]]
                  else:
                      continue
                  for n in names:
                      if n and n not in stdlib and n != "tcgcov":
                          bad.append(f"{p}: {n}")
          if bad:
              print("non-stdlib imports found:")
              print("\n".join(bad))
              raise SystemExit(1)
          print("clean: stdlib only")
          PY
      - name: Build the package
        run: |
          python -m pip install --upgrade pip build
          python -m build
      - name: CLI smoke test
        run: |
          python -m pip install dist/*.whl
          tcgcov --version
          tcgcov --help

  plugin:
    name: TCG plugin build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y libglib2.0-dev
      - name: Fetch the QEMU plugin header
        run: |
          # Building the plugin needs only qemu-plugin.h, not a QEMU tree.
          mkdir -p .ci/include/qemu
          curl -fsSL -o .ci/include/qemu/qemu-plugin.h \
            https://raw.githubusercontent.com/qemu/qemu/master/include/qemu/qemu-plugin.h
      - name: Compile
        run: |
          gcc -fsyntax-only -std=gnu11 -Wall -Wextra \
              -I.ci/include $(pkg-config --cflags glib-2.0) \
              plugin/tcgcov.c

  shellcheck:
    name: shellcheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: sudo apt-get update && sudo apt-get install -y shellcheck
      - run: shellcheck tcgcov-report.sh

  no-local-paths:
    name: no local paths
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Reject committed developer home paths
        run: |
          # Docs here quote real command lines; keep them free of local paths.
          if git grep -InE '/Users/[A-Za-z0-9_.-]+/|/home/[A-Za-z0-9_.-]+/|/local/home' \
               -- . ':!.github/workflows/ci.yml'; then
            echo "::error::committed absolute developer paths; use placeholders"
            exit 1
          fi
          echo "clean"
